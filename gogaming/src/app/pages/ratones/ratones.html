<section class="mx-auto w-[95%] md:w-[85%] py-6">
  <aside class="filters rounded-none hidden md:block">
      <h3 class="text-lg font-bold mb-4">Filtros</h3>
      <button (click)="clearFilters()" class="w-full mb-4 px-3 py-2 rounded-lg bg-white/10 hover:bg-white/20 text-white text-sm font-semibold">Limpiar filtros</button>
      <div class="filter-group mb-5">
        <div class="filter-title">Por precios</div>
        <ul class="space-y-2 text-sm">
          <li *ngFor="let r of priceRanges">
            <label class="filter-option">
              <input type="checkbox" (change)="toggleRange(r.id)" [checked]="selectedRanges.has(r.id)" />
              <span class="label-text">{{ r.label }}</span>
            </label>
          </li>
        </ul>
      </div>
      <div class="filter-group mb-5">
        <div class="filter-title">Por marca</div>
        <ul class="space-y-2 text-sm">
          <li *ngFor="let m of brands">
            <label class="filter-option">
              <input type="checkbox" (change)="toggleBrand(m)" [checked]="selectedBrands.has(m)" />
              <span class="label-text">{{ m }}</span>
            </label>
          </li>
        </ul>
      </div>
  </aside>

  <div class="md:ml-[280px]">
    <main>
      <h1 class="text-2xl md:text-3xl font-bold mb-3">Ratones para juegos</h1>
      <p class="text-gray-700 mb-6">Explora nuestra selección de ratones gaming. Filtra por precio y marca, y carga más cuando quieras.</p>

      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5">
        <article *ngFor="let p of visibleRatones; trackBy: trackById" class="bg-gray-100 rounded-xl shadow-sm p-4 flex flex-col">
          <div class="h-30 flex items-center justify-center">
            <img [src]="p.image ? p.image : '/raton.png'" alt="{{ p.marca }}" class="object-contain">
          </div>
          <div class="mt-3 text-sm">
            <div class="text-gray-900 font-bold">{{ p.marca }}</div>
            <div class="text-gray-600">{{ p.nombre }}</div>
          </div>
          <div class="mt-3 flex items-center justify-between">
            <span class="text-gray-900 font-bold text-2xl">{{ p.precio }} €</span>
            <button aria-label="Añadir al carrito" (click)="goToProduct(p.id)" class="w-8 h-8 rounded-full bg-black text-white flex items-center justify-center">+</button>
          </div>
        </article>
      </div>

      <div class="mt-8 flex items-center justify-center">
        <button (click)="loadMore()" [disabled]="visible >= filteredRatones.length" class="px-5 py-2 rounded-full bg-[#CC0000] text-white font-semibold disabled:opacity-50">
          Cargar más
        </button>
      </div>
    </main>
  </div>
</section>
