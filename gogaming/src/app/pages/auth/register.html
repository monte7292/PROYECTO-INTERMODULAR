<section class="auth mx-auto w-[92%] md:w-[78%] py-8">
  <form class="form-card space-y-4" (ngSubmit)="submit()" #f="ngForm">
    <h1 class="form-title">Crear cuenta</h1>
    <input [(ngModel)]="nombre" name="nombre" type="text" placeholder="Nombre" class="input" required />
    <input [(ngModel)]="email" name="email" type="email" placeholder="E-mail*" class="input" required />
    <div class="relative">
      <input [(ngModel)]="password" name="password" [type]="showPass ? 'text' : 'password'" placeholder="Contraseña*" class="input pr-10" required />
      <button type="button" class="eye" (click)="showPass = !showPass" aria-label="Mostrar u ocultar contraseña">
        <svg *ngIf="!showPass" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" class="w-5 h-5">
          <path d="M2.5 12c1.7-4.6 5.6-7.5 9.5-7.5S19.3 7.4 21 12c-1.7 4.6-5.6 7.5-9.5 7.5S4.2 16.6 2.5 12z" stroke="currentColor" stroke-width="2"/>
          <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
        </svg>
        <svg *ngIf="showPass" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" class="w-5 h-5">
          <path d="M2.5 12c1.7-4.6 5.6-7.5 9.5-7.5S19.3 7.4 21 12c-1.7 4.6-5.6 7.5-9.5 7.5S4.2 16.6 2.5 12z" stroke="currentColor" stroke-width="2"/>
          <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
          <path d="M3 3l18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <div class="relative">
      <input [(ngModel)]="confirm" name="confirm" [type]="showConfirm ? 'text' : 'password'" placeholder="Repetir contraseña*" class="input pr-10" required />
      <button type="button" class="eye" (click)="showConfirm = !showConfirm" aria-label="Mostrar u ocultar repetición de contraseña">
        <svg *ngIf="!showConfirm" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" class="w-5 h-5">
          <path d="M2.5 12c1.7-4.6 5.6-7.5 9.5-7.5S19.3 7.4 21 12c-1.7 4.6-5.6 7.5-9.5 7.5S4.2 16.6 2.5 12z" stroke="currentColor" stroke-width="2"/>
          <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
        </svg>
        <svg *ngIf="showConfirm" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" class="w-5 h-5">
          <path d="M2.5 12c1.7-4.6 5.6-7.5 9.5-7.5S19.3 7.4 21 12c-1.7 4.6-5.6 7.5-9.5 7.5S4.2 16.6 2.5 12z" stroke="currentColor" stroke-width="2"/>
          <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
          <path d="M3 3l18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <label class="checkbox">
      <input [(ngModel)]="accept" name="accept" type="checkbox" />
      <span>He leído y acepto la política de privacidad</span>
    </label>
    <label class="checkbox">
      <input [(ngModel)]="marketing" name="marketing" type="checkbox" />
      <span>Recibir descuentos exclusivos por e-mail</span>
    </label>
    <button type="submit" class="btn-primary">Crear cuenta</button>
    <div *ngIf="error" class="error">{{ error }}</div>
    <a class="switch-link" routerLink="/login">Ya tengo una cuenta</a>
    <a class="btn-secondary" routerLink="/login">Iniciar sesión</a>
  </form>
  <div *ngIf="toast" class="toast">Cuenta creada</div>
</section>
