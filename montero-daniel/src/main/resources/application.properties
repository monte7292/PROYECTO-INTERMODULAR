spring.application.name=montero-daniel
spring.datasource.url=jdbc:mariadb://localhost:3306/gogaming_shop?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:gogaming}
spring.datasource.password=${DB_PASSWORD:gogaming}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.sql.init.continue-on-error=true
spring.datasource.hikari.initializationFailTimeout=0
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
